plugins {
    id 'org.springframework.boot' version '3.5.14' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    javaVersion = 24
    springCloudVersion = '2025.0.0'
    mapstructVersion = '1.6.3'
    jspecifyVersion = '1.0.0'
    springdocVersion = '2.8.9'
}

configure(subprojects.findAll { it.name != 'common-events' }) {
    pluginManager.withPlugin('java') {
        dependencies {
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            implementation 'io.micrometer:micrometer-tracing-bridge-otel'
            implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
            runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
        }
    }
}

subprojects {
    group = 'com.draftlab'
    version = '0.0.1-SNAPSHOT'

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(rootProject.ext.javaVersion)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = rootProject.ext.javaVersion
            options.encoding = 'UTF-8'
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}
