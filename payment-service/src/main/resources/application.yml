server:
  port: 8082

app:
  ledger-url: http://localhost:8083

spring:
  application:
    name: payment-service
  cloud:
    openfeign:
      client:
        config:
          ledger-service:
            connectTimeout: 500
            readTimeout: 1000
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: draftlab
    password: draftlab
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  cache:
    cache-names: payments-by-order
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

resilience4j:
  circuitbreaker:
    instances:
      ledger:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      ledger:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - feign.FeignException
          - feign.RetryableException
          - java.net.SocketTimeoutException
  bulkhead:
    instances:
      ledger:
        max-concurrent-calls: 10
        max-wait-duration: 100ms
  timelimiter:
    instances:
      ledger:
        timeout-duration: 1200ms
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,retries,bulkheads
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[%X{correlationId:-},%X{traceId:-},%X{spanId:-}] "

springdoc:
  swagger-ui:
    path: /swagger-ui.html
