services:
  postgres:
    image: postgres:17
    container_name: draftlab-postgres
    environment:
      POSTGRES_USER: draftlab
      POSTGRES_PASSWORD: draftlab
      POSTGRES_DB: draftlab
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftlab -d draftlab"]
      interval: 2s
      timeout: 3s
      retries: 15

  database-migrations:
    image: postgres:17
    container_name: draftlab-database-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: draftlab
    volumes:
      - ./docker/postgres/init-databases.sql:/migrations/init-databases.sql:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - draftlab
      - -d
      - draftlab
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/init-databases.sql
    restart: "no"

  kafka:
    image: apache/kafka:4.0.0
    container_name: draftlab-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    container_name: draftlab-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres-data:
