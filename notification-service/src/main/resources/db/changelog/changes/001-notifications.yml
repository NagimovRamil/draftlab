databaseChangeLog:
  - changeSet:
      id: 001-notifications
      author: Ramil Nagimov
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: varchar(1024)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createTable:
            tableName: processed_messages
            columns:
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: consumer_name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
